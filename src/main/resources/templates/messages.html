<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashBid - 메시지함</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: white; font-family: 'Pretendard', sans-serif; }
        .message-item { transition: all 0.2s; }
        .message-item:hover { background-color: #252525; }
        .unread { border-left: 4px solid #FF4D00; }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-4xl mx-auto">
    <header class="flex justify-between items-center mb-8 bg-[#1E1E1E] p-6 rounded-2xl border border-gray-800 shadow-xl">
        <div class="flex items-center space-x-4">
            <a th:href="@{/}" class="text-gray-500 hover:text-white transition">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-2xl font-black text-white italic">MY MESSAGES</h1>
        </div>
        <span class="text-xs text-gray-500 uppercase font-bold tracking-widest" sec:authentication="principal.nickname">닉네임</span>
    </header>

    <div class="bg-[#1E1E1E] rounded-3xl border border-gray-800 overflow-hidden shadow-2xl">
        <div th:if="${#lists.isEmpty(messages)}" class="p-20 text-center">
            <svg class="mx-auto h-16 w-16 text-gray-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0l-8 5-8-5"></path>
            </svg>
            <p class="text-gray-500 font-medium">받은 메시지가 없습니다.</p>
        </div>

        <div th:unless="${#lists.isEmpty(messages)}" class="divide-y divide-gray-800">
            <div th:each="msg : ${messages}"
                 class="message-item p-6 flex items-start justify-between cursor-pointer"
                 th:classappend="${!msg.isRead} ? 'unread' : ''">
                <div class="flex items-start space-x-4 overflow-hidden">
                    <div class="w-12 h-12 rounded-2xl bg-[#2A2A2A] flex-shrink-0 flex items-center justify-center text-[#007AFF] font-bold">
                        <span th:text="${#strings.substring(msg.senderNickname,0,1)}">M</span>
                    </div>
                    <div class="overflow-hidden">
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="font-bold text-gray-100" th:text="${msg.senderNickname}">발신자</span>
                            <span th:if="${!msg.isRead}" class="w-2 h-2 bg-[#FF4D00] rounded-full"></span>
                        </div>
                        <p class="text-sm text-gray-400 truncate" th:text="${msg.content}">메시지 미리보기 내용이 여기에 표시됩니다...</p>
                    </div>
                </div>
                <div class="text-right flex-shrink-0 ml-4">
                    <p class="text-[10px] text-gray-500 uppercase font-bold mb-1" th:text="${msg.sentTime}">10분 전</p>
                    <button class="text-[#007AFF] text-xs font-bold hover:underline">보기</button>
                </div>
            </div>
        </div>
    </div>

    <p class="mt-6 text-center text-xs text-gray-600">
        낙찰 정보 및 입찰 관련 알림이 메시지함으로 전송됩니다.
    </p>
</div>
</body>
</html>
