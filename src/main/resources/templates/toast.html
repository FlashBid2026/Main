<div id="toast-container" class="fixed top-24 right-6 z-[100] space-y-4 w-80"></div>

<script>
  /**
   * FlashBid 알림 모듈
   * @param {string} type - 'info', 'success', 'warning', 'end', 'outbid'
   * @param {string} title - 알림 제목
   * @param {string} message - 알림 내용
   */
  function showFlashNotification(type, title, message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const styles = {
          info:    { border: 'border-[#007AFF]', bg: 'bg-blue-900/20',    text: 'text-[#007AFF]' },
          success: { border: 'border-[#00FFA3]', bg: 'bg-green-900/20',   text: 'text-[#00FFA3]' },
          warning: { border: 'border-[#FF4D00]', bg: 'bg-orange-900/20',  text: 'text-[#FF4D00]' },
          end:     { border: 'border-[#FF4D00]', bg: 'bg-orange-900/20',  text: 'text-[#FF4D00]' },
          outbid:  { border: 'border-yellow-500', bg: 'bg-yellow-900/20', text: 'text-yellow-400' }
      };

      const s = styles[type.toLowerCase()] || styles.info;

      toast.className = `flex flex-col p-4 rounded-2xl border ${s.border} ${s.bg} backdrop-blur-md shadow-2xl transform transition-all duration-500 translate-x-full opacity-0`;

      toast.innerHTML = `
          <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-black uppercase tracking-widest ${s.text}">${title}</span>
              <button onclick="this.parentElement.parentElement.remove()" class="text-gray-500 hover:text-white">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
          </div>
          <p class="text-sm text-gray-200 font-medium">${message}</p>
      `;

      container.appendChild(toast);

      setTimeout(() => {
          toast.classList.remove('translate-x-full', 'opacity-0');
      }, 100);

      setTimeout(() => {
          toast.classList.add('translate-x-full', 'opacity-0');
          setTimeout(() => toast.remove(), 500);
      }, 5000);
  }

  // 미읽음 알림 폴링 (15초마다)
  (function startNotificationPolling() {
      let polling = true;

      async function pollUnread() {
          if (!polling) return;
          try {
              const res = await fetch('/api/notifications/unread', {
                  credentials: 'same-origin'
              });
              if (res.status === 401) {
                  polling = false;
                  return;
              }
              if (!res.ok) return;

              const notifications = await res.json();
              for (const n of notifications) {
                  showFlashNotification(n.type, n.title, n.message);
                  fetch(`/api/notifications/${n.id}/read`, {
                      method: 'PATCH',
                      credentials: 'same-origin'
                  }).catch(() => {});
              }
          } catch (e) {
              // 네트워크 오류 시 무시
          }
      }

      // 페이지 로드 후 5초 뒤 첫 번째 폴링, 이후 15초 간격
      setTimeout(function() {
          pollUnread();
          setInterval(pollUnread, 15000);
      }, 5000);
  })();
</script>
